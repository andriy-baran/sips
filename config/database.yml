default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  username: horizon
  password:

test:
  <<: *default
  database: sips_test

development:
  <<: *default
  database: sips_development

staging:
  <<: *default
  host:     <%= ENV['STAGING_SIPS_HOSTNAME'] %>
  port:     <%= ENV['STAGING_SIPS_PORT'] %>
  database: <%= ENV['STAGING_SIPS_DB_NAME'] %>
  username: <%= ENV['STAGING_SIPS_USERNAME'] %>
  password: <%= ENV['STAGING_SIPS_PASSWORD'] %>


production:
  <<: *default
  host:     <%= ENV['PRODUCTION_SIPS_HOSTNAME'] %>
  port:     <%= ENV['PRODUCTION_SIPS_PORT'] %>
  database: <%= ENV['PRODUCTION_SIPS_DB_NAME'] %>
  username: <%= ENV['PRODUCTION_SIPS_USERNAME'] %>
  password: <%= ENV['PRODUCTION_RDS_PASSWORD'] %>
